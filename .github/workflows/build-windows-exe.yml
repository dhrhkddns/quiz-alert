name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip -r requirements-build.txt

      - name: Refresh question bank
        run: python extra_bank.py

      - name: Build QuizAlert.exe
        run: python -m PyInstaller --noconfirm --clean quiz_alert.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuizAlert-windows
          path: dist/QuizAlert.exe
          if-no-files-found: error

      - name: Publish rolling Windows release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows
          name: Windows 실행 파일
          body: |
            파이썬 없이 실행하는 `QuizAlert.exe` 입니다.

            - 파일만 더블클릭해도 됩니다.
            - 저장소를 받은 뒤 `시작.bat`을 실행하면, exe가 없을 때 이 파일을 자동으로 받습니다.
            - 같은 폴더에 `questions.json`이 있으면 그 문제를 쓰고, 없으면 exe에 들어 있는 문제를 씁니다.
          files: dist/QuizAlert.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
